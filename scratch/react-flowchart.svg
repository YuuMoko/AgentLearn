<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="900" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <rect x="0" y="0" width="720" height="60" fill="url(#headerGrad)" rx="12"/>
  <rect x="0" y="40" width="720" height="20" fill="url(#headerGrad)"/>
  <text x="360" y="38" text-anchor="middle" fill="white" font-size="24" font-weight="bold">ReAct 范式流程图 (Reasoning + Acting)</text>

  <!-- ====== START ====== -->
  <ellipse cx="360" cy="95" rx="52" ry="20" fill="#1e293b" filter="url(#shadow)"/>
  <text x="360" y="100" text-anchor="middle" fill="white" font-size="14" font-weight="bold">用户输入</text>

  <line x1="360" y1="115" x2="360" y2="145" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ====== THOUGHT ====== -->
  <rect x="260" y="148" width="200" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="167" text-anchor="middle" fill="#1e40af" font-size="15" font-weight="bold">🤔 Thought (推理)</text>
  <text x="360" y="185" text-anchor="middle" fill="#3b82f6" font-size="11">分析当前状态，决定下一步</text>

  <line x1="360" y1="194" x2="360" y2="224" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="360,228 440,268 360,308 280,268" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="264" text-anchor="middle" fill="#92400e" font-size="12" font-weight="bold">需要调用</text>
  <text x="360" y="280" text-anchor="middle" fill="#92400e" font-size="12" font-weight="bold">工具？</text>

  <!-- LEFT branch: YES → Action -->
  <line x1="280" y1="268" x2="160" y2="268" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="220" y="260" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">是</text>

  <rect x="60" y="248" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="264" text-anchor="middle" fill="#166534" font-size="14" font-weight="bold">🔧 Action (行动)</text>
  <text x="160" y="280" text-anchor="middle" fill="#166534" font-size="11">调用工具 / 执行操作</text>

  <line x1="160" y1="288" x2="160" y2="318" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Observation -->
  <rect x="60" y="320" width="200" height="40" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="336" text-anchor="middle" fill="#6b21a8" font-size="14" font-weight="bold">👁 Observation (观察)</text>
  <text x="160" y="352" text-anchor="middle" fill="#6b21a8" font-size="11">获取工具返回结果</text>

  <!-- Feedback arrow from Observation back to loop top -->
  <path d="M 60,340 L 30,340 L 30,171 L 252,171" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="18" y="258" text-anchor="middle" fill="#9333ea" font-size="11" transform="rotate(-90, 18, 258)">反馈循环</text>

  <!-- RIGHT branch: NO → Answer -->
  <line x1="440" y1="268" x2="540" y2="268" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="260" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="bold">否</text>

  <rect x="540" y="248" width="160" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="264" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold">✅ Final Answer</text>
  <text x="620" y="280" text-anchor="middle" fill="#991b1b" font-size="11">输出最终回答</text>

  <line x1="620" y1="288" x2="620" y2="318" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- END -->
  <ellipse cx="620" cy="340" rx="52" ry="18" fill="#1e293b" filter="url(#shadow)"/>
  <text x="620" y="345" text-anchor="middle" fill="white" font-size="13" font-weight="bold">结束</text>

  <!-- ====== DETAIL: ReAct Loop Expansion (bottom half) ====== -->
  <rect x="30" y="390" width="660" height="36" rx="6" fill="#e2e8f0"/>
  <text x="360" y="413" text-anchor="middle" fill="#334155" font-size="14" font-weight="bold">单轮 ReAct 循环展开</text>

  <!-- Loop round 1 -->
  <rect x="30" y="440" width="660" height="130" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="462" fill="#475569" font-size="13" font-weight="bold">第 1 轮</text>

  <rect x="55" y="474" width="180" height="42" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="145" y="491" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">Thought</text>
  <text x="145" y="507" text-anchor="middle" fill="#2563eb" font-size="10">"我需要查今天的天气"</text>

  <text x="245" y="498" text-anchor="middle" fill="#94a3b8" font-size="16">→</text>

  <rect x="255" y="474" width="180" height="42" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="345" y="491" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">Action</text>
  <text x="345" y="507" text-anchor="middle" fill="#16a34a" font-size="10">调用 get_weather("北京")</text>

  <text x="445" y="498" text-anchor="middle" fill="#94a3b8" font-size="16">→</text>

  <rect x="455" y="474" width="210" height="42" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="560" y="491" text-anchor="middle" fill="#6b21a8" font-size="12" font-weight="bold">Observation</text>
  <text x="560" y="507" text-anchor="middle" fill="#9333ea" font-size="10">"北京 晴 22°C"</text>

  <!-- Loop round 2 -->
  <rect x="30" y="580" width="660" height="130" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="602" fill="#475569" font-size="13" font-weight="bold">第 2 轮</text>

  <rect x="55" y="614" width="180" height="42" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="145" y="631" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">Thought</text>
  <text x="145" y="647" text-anchor="middle" fill="#2563eb" font-size="10">"天气不错，可以回答用户了"</text>

  <text x="245" y="638" text-anchor="middle" fill="#94a3b8" font-size="16">→</text>

  <rect x="255" y="614" width="390" height="42" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="450" y="631" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">Final Answer</text>
  <text x="450" y="647" text-anchor="middle" fill="#dc2626" font-size="10">"北京今天晴天，气温22°C，适合出行。"</text>

  <!-- ====== Key Points ====== -->
  <rect x="30" y="740" width="660" height="140" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="50" y="764" fill="#c2410c" font-size="14" font-weight="bold">💡 核心要点</text>

  <circle cx="55" cy="786" r="4" fill="#ea580c"/>
  <text x="68" y="790" fill="#7c2d12" font-size="12">Thought → Action → Observation 三者形成闭环，持续迭代直到得出最终答案</text>

  <circle cx="55" cy="809" r="4" fill="#ea580c"/>
  <text x="68" y="813" fill="#7c2d12" font-size="12">Thought 决定是否需要工具调用：需要则执行 Action，不需要则输出 Final Answer</text>

  <circle cx="55" cy="832" r="4" fill="#ea580c"/>
  <text x="68" y="836" fill="#7c2d12" font-size="12">Observation 的结果注入下一轮 Thought，形成可观测的推理链（区别于 CoT 的纯推理）</text>

  <circle cx="55" cy="855" r="4" fill="#ea580c"/>
  <text x="68" y="859" fill="#7c2d12" font-size="12">典型应用：AutoGPT、LangChain Agent、OpenAI Function Calling、Claude Tool Use</text>
</svg>
